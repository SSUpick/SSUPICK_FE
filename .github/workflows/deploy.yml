name: Lint and sync to deploy repo

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  sync:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push source to deploy repo
        run: |
          git remote add deploy https://ssumai-kr:${{ secrets.CLAP_TOKEN }}@github.com/ssumai-kr/SSUPICK_FE.git
          git push deploy HEAD:main --force
